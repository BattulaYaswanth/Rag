name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write # push image to GHCR on main

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
      - run: uvx ruff@0.16.10 check src/ tests/
      - run: uvx ruff@0.16.10 format --check src/ tests/

  test:
    name: Pytest (offline unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest tests/ -q

  pipeline-success:
    name: pipeline success
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check required job status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more dependent jobs failed!"
            exit 1
          fi
          echo "All jobs succeeded!"
