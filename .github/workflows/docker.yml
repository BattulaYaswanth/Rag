name: Docker

# Image pipeline: build both images, smoke-test the running containers,
# push to Docker Hub on main. (Lint/unit tests live in ci.yml.)
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "frontend/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, smoke-test, push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/advanced-rag
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/metadata-action@v5
        id: meta-frontend
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/advanced-rag-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: advanced-rag-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: advanced-rag-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No API keys or models needed: /health only touches config + Chroma.
      - name: Smoke-test backend container
        run: |
          docker run -d --name rag-api -p 8000:8000 advanced-rag-backend:ci
          for i in $(seq 1 30); do
            BODY=$(curl -s http://127.0.0.1:8000/health || true)
            echo "$BODY" | grep -q '"mode":"local"' && break
            sleep 10
          done
          echo "$BODY" | grep -q '"mode":"local"'

      - name: Smoke-test frontend container (proxied via backend)
        run: |
          docker run -d --name rag-frontend -p 3000:3000 \
            -e BACKEND_URL=http://172.17.0.1:8000 advanced-rag-frontend:ci
          sleep 5
          curl -s http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -s http://127.0.0.1:3000/api/health | grep -q '"mode":"local"'

      - name: Push backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Push frontend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
